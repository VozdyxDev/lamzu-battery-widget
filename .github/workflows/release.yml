name: Publish release

on:
  create:

permissions:
  contents: read

concurrency:
  group: lamzu-publish-release
  queue: max

jobs:
  build:
    if: ${{ github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v') }}
    uses: ./.github/workflows/build.yml

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release commit and its history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download the Windows archive from this run
        uses: actions/download-artifact@v8
        with:
          name: lamzu-battery-widget-windows-x64
          path: ${{ runner.temp }}/lamzu-release

      - name: Generate changelog and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/release/v* ]]; then
            printf 'Expected a release/v* branch, got %s.\n' "$GITHUB_REF" >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME#release/}"
          tag_ref="refs/tags/$tag"
          asset_name="LAMZU-Battery-Widget-windows-x64.zip"
          asset="$RUNNER_TEMP/lamzu-release/$asset_name"
          releases="$RUNNER_TEMP/lamzu-releases.json"
          notes="$RUNNER_TEMP/lamzu-release-notes.md"

          git check-ref-format "$tag_ref"
          commit=$(git rev-parse --verify HEAD)
          if [[ "$commit" != "$GITHUB_SHA" ]]; then
            printf 'The checkout does not match the commit built in this run.\n' >&2
            exit 1
          fi

          remote_tag=$(git ls-remote origin "$tag_ref" "$tag_ref^{}")
          tagged_commit=$(awk -v ref="$tag_ref" '
            $2 == ref { object = $1 }
            $2 == ref "^{}" { peeled = $1 }
            END { print (peeled ? peeled : object) }
          ' <<< "$remote_tag")
          if [[ -n "$tagged_commit" && "$tagged_commit" != "$commit" ]]; then
            printf 'Release tag %s points to a different commit.\n' "$tag" >&2
            exit 1
          fi

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
          if jq -e --arg tag "$tag" 'any(.[][]; .tag_name == $tag and .draft == false)' "$releases" > /dev/null; then
            if [[ "$tagged_commit" != "$commit" ]] || ! jq -e --arg tag "$tag" --arg asset "$asset_name" '
              any(.[][]; .tag_name == $tag and .draft == false and any(.assets[]?; .name == $asset))
            ' "$releases" > /dev/null; then
              printf 'The published release %s lacks the expected tag or archive.\n' "$tag" >&2
              exit 1
            fi
            printf 'Release %s is already published.\n' "$tag"
            exit 0
          fi
          if jq -e --arg tag "$tag" 'any(.[][]; .tag_name == $tag and .draft == true)' "$releases" > /dev/null; then
            printf 'A draft release already exists for %s.\n' "$tag" >&2
            exit 1
          fi

          if [[ ! -s "$asset" ]]; then
            printf 'The release archive is missing or empty: %s\n' "$asset" >&2
            exit 1
          fi

          previous=$(jq -r '
            [.[][] | select(.draft == false and .published_at != null)]
            | sort_by(.published_at, .id) | last | .tag_name // empty
          ' "$releases")
          revision="$commit"
          if [[ -n "$previous" ]]; then
            if ! previous_commit=$(git rev-parse --verify --end-of-options "refs/tags/${previous}^{commit}"); then
              printf 'The last published release tag %s is missing from Git.\n' "$previous" >&2
              exit 1
            fi
            revision="$previous_commit..$commit"
          fi

          changes=$(git log --format='- %s (`%h`)' "$revision")
          {
            printf '## Changes\n\n'
            if [[ -n "$changes" ]]; then
              printf '%s\n' "$changes"
            else
              printf 'There are no new commits since the previous release.\n'
            fi
          } > "$notes"

          if [[ -z "$tagged_commit" ]]; then
            git -c push.followTags=false push --force-with-lease="$tag_ref:" origin "$commit:$tag_ref"
          fi
          gh release create --repo "$GITHUB_REPOSITORY" --verify-tag --title "LAMZU Battery Widget $tag" --notes-file "$notes" -- "$tag" "$asset"

      - name: Delete the published release branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/release/v* ]]; then
            printf 'Refusing to delete a branch outside release/v*: %s\n' "$GITHUB_REF" >&2
            exit 1
          fi
          remote_branch=$(git ls-remote --refs origin "$GITHUB_REF")
          if [[ -n "$remote_branch" ]]; then
            git -c push.followTags=false push --force-with-lease="$GITHUB_REF:$GITHUB_SHA" origin ":$GITHUB_REF"
          fi
