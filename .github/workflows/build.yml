name: Build Windows widget

on:
  push:
    branches:
      - '**'
      - '!release/v**'
  workflow_call:
    inputs:
      release_branch:
        description: Branch that determines the Windows release version
        type: string
        default: ''
    outputs:
      version:
        description: Version embedded in the widget and installer
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update --target x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: x86_64-pc-windows-msvc
          cmd-format: rustup run stable {0}

      - name: Resolve package version
        id: version
        env:
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          if ($env:RELEASE_BRANCH) {
            $component = '(?:0|[1-9][0-9]*)'
            if ($env:RELEASE_BRANCH -cmatch "\Arelease/v($component\.$component\.$component)\z") {
              $version = $Matches[1]
            } else {
              throw 'Release branches must be named release/vX.Y.Z.'
            }
            foreach ($part in $version.Split('.')) {
              [uint64]$number = 0
              if (-not [uint64]::TryParse($part, [ref]$number)) {
                throw 'Each release version component must fit in an unsigned 64-bit integer.'
              }
            }
          } else {
            $metadata = cargo +stable metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $version = ($metadata.packages | Where-Object name -eq 'lamzu-widget').version
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "LAMZU_WIDGET_VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: cargo +stable test --workspace --locked --target x86_64-pc-windows-msvc

      - name: Build release executable
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: cargo +stable build --workspace --release --locked --target x86_64-pc-windows-msvc

      - name: Create portable ZIP
        run: >-
          Compress-Archive
          -LiteralPath 'target/x86_64-pc-windows-msvc/release/lamzu-widget.exe'
          -DestinationPath 'target/LAMZU-Battery-Widget-windows-x64.zip'

      - name: Build Inno Setup installer
        run: iscc /Qp "/DAppVersion=$env:LAMZU_WIDGET_VERSION" installer/lamzu-widget.iss

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: lamzu-battery-widget-windows-x64
          path: |
            target/LAMZU-Battery-Widget-windows-x64.zip
            target/LAMZU-Battery-Widget-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0
          overwrite: true
